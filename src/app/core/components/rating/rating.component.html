<div class="rating-container">
  <p>Rate your driver:</p>
  <div class="stars">
    <span *ngFor="let star of [1, 2, 3, 4, 5]" (click)="setRating(star)">
      <i [class]="star <= rating ? 'fas fa-star' : 'far fa-star'"></i>
    </span>
  </div>
  <button (click)="submitRating()" [disabled]="rating === 0">Submit</button>
</div>
