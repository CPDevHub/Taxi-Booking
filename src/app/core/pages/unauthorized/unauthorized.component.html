<kendo-card
  class="unauthorized-card"
  style="max-width: 400px; margin: 3rem auto; text-align: center"
>
  <kendo-card-header>
    <h1>403</h1>
  </kendo-card-header>
  <kendo-card-body>
    <p>Sorry, you do not have permission to access this page.</p>
    <button kendoButton look="outline" (click)="goToLogin()">Go To Login</button>
  </kendo-card-body>
</kendo-card>
